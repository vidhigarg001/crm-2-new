<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | CRM System</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
    .container { width: 300px; padding: 20px; background-color: white; margin: 100px auto; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
    .btn { background-color: #007bff; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form>
      <input type="text" placeholder="Username" required style="width: 100%; padding: 10px; margin-bottom: 10px;" />
      <input type="password" placeholder="Password" required style="width: 100%; padding: 10px; margin-bottom: 10px;" />
      <input type="email" placeholder="Email" required style="width: 100%; padding: 10px; margin-bottom: 10px;" />
      <button class="btn" type="submit">Register</button>
    </form>
    <a href="login.html">Already have an account? Login</a>
  </div>
</body>
</html>
